<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Pulse</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell">
  <header class="drag"><div class="brand"><span class="logo">C</span><span><b>CODEX PULSE</b><small id="status">CONNECTING</small></span></div><div class="actions no-drag"><button id="compact" title="Compact mode">−</button><button id="close" title="Hide">×</button></div></header>
  <section class="content drag"><div class="plan"><strong id="plan">Detecting plan…</strong><em>LIVE</em></div><div id="limits"></div>
    <div class="telemetry" id="telemetry"><span><small>PROCESSED</small><b id="total">−</b></span><span><small>CACHED</small><b id="cached">−</b></span><span><small>EST. LEFT</small><b id="estimate">Calibrating…</b></span></div>
    <p id="notice"></p>
  </section>
  <footer class="drag"><span id="source">LOCAL-FIRST</span><span id="updated"> · Never updated</span><button class="no-drag" id="refresh" title="Refresh now (automatic every minute)">R</button></footer>
</main><script src="renderer.js"></script></body></html>
